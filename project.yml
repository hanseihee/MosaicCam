    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: realmasse.mosaiccam
        TARGETED_DEVICE_FAMILY: "1"
        # 문자열 카탈로그(Localizable.xcstrings, InfoPlist.xcstrings)로 번역
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      storeKitConfiguration: MosaicCam/Products.storekit   # 시뮬레이터·실기기 시험 결제
      testTargets:
        - MosaicCamUITests
  MosaicCamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MosaicCamUITests
      - path: MosaicCam/Products.storekit   # 테스트에서 SKTestSession으로 시험 결제를 켠다
        buildPhase: resources
    dependencies:
      - target: MosaicCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: realmasse.mosaiccam.uitests
        GENERATE_INFOPLIST_FILE: YES
