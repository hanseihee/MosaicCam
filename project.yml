name: MosaicCam
options:
  developmentLanguage: ko
  bundleIdPrefix: realmasse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  MosaicCore:
    path: MosaicCore
settings:
  base:
    DEVELOPMENT_TEAM: RT556U3WKT
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MosaicCam:
    type: application
    platform: iOS
    sources:
      - path: MosaicCam
    dependencies:
      - package: MosaicCore
        product: MosaicCore
    info:
      path: MosaicCam/Info.plist
      properties:
        CFBundleDisplayName: 모자이크
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: 번호판과 얼굴을 가릴 사진을 찍습니다.
        NSPhotoLibraryAddUsageDescription: 모자이크한 사진을 사진 앱에 저장합니다.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: realmasse.mosaiccam
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - MosaicCamUITests
  MosaicCamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MosaicCamUITests
    dependencies:
      - target: MosaicCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: realmasse.mosaiccam.uitests
        GENERATE_INFOPLIST_FILE: YES
