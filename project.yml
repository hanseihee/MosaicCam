name: MosaicCam
options:
  developmentLanguage: ko
  bundleIdPrefix: realmasse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  MosaicCore:
    path: MosaicCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.11.0
settings:
  base:
    DEVELOPMENT_TEAM: RT556U3WKT
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MosaicCam:
    type: application
    platform: iOS
    sources:
      - path: MosaicCam
        excludes:
          - "*.storekit"   # 시험용 결제 설정은 앱에 넣지 않고 스킴에서만 쓴다
    dependencies:
      - package: MosaicCore
        product: MosaicCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: MosaicCam/Info.plist
      properties:
        CFBundleDisplayName: 모자이크
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: 번호판과 얼굴을 가릴 사진을 찍습니다.
        NSPhotoLibraryAddUsageDescription: 모자이크한 사진을 사진 앱에 저장합니다.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # 에드몹 앱 ID (콘솔의 "모자이크" 앱)
        GADApplicationIdentifier: ca-app-pub-4582716621646848~8041576819
        NSUserTrackingUsageDescription: 광고를 더 알맞게 보여 주는 데 씁니다. 허용하지 않아도 앱은 그대로 쓸 수 있어요.
        # 구글이 안내하는 광고 네트워크 목록 (https://developers.google.com/admob/ios/3p-skadnetworks)
